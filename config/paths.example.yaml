# Machine paths for the Maker Mastery tools.
#
# How to use this file:
#   1. Copy it to config\paths.yaml (tools\setup.ps1 does this for you the first time it runs).
#   2. Edit config\paths.yaml, never this example. config\paths.yaml is ignored by git, so your own paths stay on your PC.
#   3. Write Windows paths with forward slashes, or in single quotes:
#        bambu_studio_exe: "E:/Apps/Bambu Studio/bambu-studio.exe"      forward slashes: fine
#        bambu_studio_exe: 'E:\Apps\Bambu Studio\bambu-studio.exe'      single quotes: fine
#      Never put backslashes inside double quotes ("E:\Apps\..."): YAML reads \b, \t, \n and similar as control
#      characters, so the path breaks. "Copy as path" in File Explorer gives exactly that form, so change it.
#      A relative path is read from the repository folder.
#   4. Check the result with:  .venv\Scripts\python.exe tools\mm_config.py
#
# Every tool reads these values through tools\mm_config.py. No tool has a drive letter or a user folder built in.

# Where Bambu Studio is installed. The slicing helper (tools\slice_cli.py) runs this program, and the audit reads the
# filament colour catalogue and the profiles that ship next to it. The value below is the default install location.
bambu_studio_exe: "C:/Program Files/Bambu Studio/bambu-studio.exe"

# Folder that holds Bambu Studio's printer, process and filament profiles (the folder that contains "BBL").
# Leave it empty and the tools look in two places, in this order:
#   %APPDATA%\BambuStudio\system         (the copy Bambu Studio keeps up to date for your Windows user)
#   <install folder>\resources\profiles  (the copy that came with the installer)
bambu_profiles_dir: ""

# Optional: full path to blender.exe. Only the stability render (tools\stability_check.py --render) uses it.
# Leave it empty and that render is skipped with a message; every other check still runs.
blender_exe: ""

# Scratch folder for slicing runs. tools\slice_cli.py copies your 3MF here and the slicer writes its output here.
# Relative to the repository folder. Keep it free of spaces: the Bambu Studio command line is more reliable that way.
slice_workdir: "work/slice"

# Folders the read-only audit MCP server (tools\mcp\mm_audit_server.py) may open. A file outside these folders is
# refused. "." means the repository folder. Add the folder where you keep your print projects, for example:
#   allowed_roots: [".", "D:/Prints"]
allowed_roots: ["."]

# Folders that Claude must never write to. The guard hook (tools\hooks\guard_paths.py) blocks Claude's file-tool writes
# and common write-like shell commands that target one of them; the MCP server also refuses to read from them.
# It is a safety net, not a sandbox (docs\09-troubleshooting.md, section 14). Emptying this list switches it off.
# Use it for anything you want Claude to leave alone, for example a finished project or a backup drive:
#   protected_roots: ["D:/Finished Projects"]
protected_roots: []
